<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Peer Network</title>
    <meta name="theme-color" content="#00beff" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/pwa/icon-192.png" />
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #0d0d14 0%, #000 70%);
            color: #fff;
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
                "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            padding: 1.5rem;
        }
        main {
            max-width: 420px;
            text-align: center;
        }
        .logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 1.25rem;
            border-radius: 22px;
            background: #00beff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #000;
            box-shadow: 0 18px 48px rgba(0, 190, 255, 0.35);
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        p {
            margin: 0 0 1.5rem;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.95rem;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 0.7rem 1.6rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: #00beff;
            color: #000;
            transition: transform 120ms ease, background 120ms ease;
        }
        button:hover {
            background: #33ccff;
        }
        button:active {
            transform: scale(0.97);
        }
        small {
            display: block;
            margin-top: 1.25rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo" aria-hidden="true">P</div>
        <h1>You're offline</h1>
        <p>
            Peer can't reach the network right now. Check your connection and try
            again — your feed will be waiting.
        </p>
        <button type="button" onclick="window.location.reload()">Try again</button>
        <small>This page is served from your device cache.</small>
    </main>
</body>
</html>
