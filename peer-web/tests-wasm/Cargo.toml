[package]
name = "peer-web-tests-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Depend on the main crate with the `hydrate` feature so we get
# `web_sys`, `wasm-bindgen`, and the same component code paths the
# production WASM bundle uses.
peer-web = { path = "..", default-features = false, features = ["hydrate"] }

leptos = { version = "0.8.0", features = ["nightly", "csr"] }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "EventInit",
    "InputEvent",
    "InputEventInit",
    "MouseEvent",
    "MouseEventInit",
    "Node",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
